name: Deploy Changeflow API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHANGEFLOW_API_TOKEN: ${{ secrets.CHANGEFLOW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply changeflow --remote
      - name: Set Worker API token
        run: printf '%s' "$CHANGEFLOW_API_TOKEN" | npx wrangler secret put CHANGEFLOW_API_TOKEN
      - name: Deploy Worker
        run: npx wrangler deploy
