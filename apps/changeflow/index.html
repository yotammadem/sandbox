function renderContext(){return `<div class="view-heading"><div><h2>Decisions & Assumptions</h2><p>ידע שנשאר יציב לאורך כל האיטרציות, ומקושר לשינויים שהוא משפיע עליהם.</p></div></div><div class="grid-main"><section><div class="sub-head">${icon('decisions')} החלטות <span class="count-tag">${state.decisions.length}</span><button class="txt-button" style="margin-right:auto" data-action="new-record" data-kind="decisions">${icon('plus','small-ico')} הוספה</button></div>${state.decisions.map(r=>renderRecord(r,'decisions')).join('')}</section><section><div class="sub-head">${icon('flag')} הנחות <span class="count-tag">${state.assumptions.length}</span><button class="txt-button" style="margin-right:auto" data-action="new-record" data-kind="assumptions">${icon('plus','small-ico')} הוספה</button></div>${state.assumptions.map(r=>renderRecord(r,'assumptions')).join('')}<div class="mini-tip">תיקון החלטה או הנחה יצורף לפידבק ויאפשר לסוכן לזהות אילו Changesets יש לבדוק מחדש.</div></section></div>`}
function pendingSummary(){const total=state.pending.length;if(!total)return '<div class="empty-card">אין פידבק חדש לשליחה.<div class="micro">בחר Changeset, אשר, דחה על Timeout או ערוך החלטה כדי להוסיף פעולה.</div></div>';return `<div class="queue-items">${state.pending.slice(-12).map(p=>`<div class="queue-item">${icon(p.type==='review'?'comment':p.type==='record'?'decisions':'graph')}<div><span>${escapeHtml(p.id)} · ${escapeHtml(p.detail)}</span><div class="subtle micro">${p.time}</div></div></div>`).join('')}</div>`}
function renderActivity(){return `<div class="view-heading"><div><h2>מחזור העבודה</h2><p>הפידבק נאסף לאורך הסקירה ונשלח לסוכן כקבוצה אחת.</p></div>${tag('neutral','סבב '+state.iteration)}</div><div class="review-split"><section class="activity-card"><div class="sub-head">${icon('activity')} היסטוריית פעילות</div><div class="activity-list">${state.activity.map(a=>`<div class="activity-item"><strong>${escapeHtml(a.title)}</strong><span>${escapeHtml(a.time)}</span><p>${escapeHtml(a.detail)}</p></div>`).join('')}</div></section><aside class="queue-card"><div class="sub-head">${icon('send')} פידבק שממתין לשליחה ${tag('neutral',state.pending.length)}</div><p>בסיום הסקירה, שולחים את כל ההערות לסוכן. בדמו הזה הפעולה <b>מדמה</b> איטרציית תיקון ומייצרת גרסאות Commit חדשות.</p>${pendingSummary()}<button class="btn btn-primary btn-full" data-action="submit-iteration" ${state.pending.length?'':'disabled'}>${icon('send')} שלח לסוכן · סימולציה</button><p class="helper centered">אין הפעלה של AI, CI או GitHub בפועל.</p></aside></div>`}
function render(){renderChrome();document.getElementById('mainView').innerHTML=({graph:renderGraph,list:renderList,context:renderContext,activity:renderActivity}[state.page]||renderGraph)();updateTimer();save()}
function navigate(page){state.page=page;render();window.scrollTo({top:0,behavior:'smooth'})}
function selectCS(id,scroll){if(!csById(id))return;state.selected=id;selectTimer(id);state.page='graph';render();if(scroll&&window.innerWidth<=870)setTimeout(()=>document.getElementById('inspector')?.scrollIntoView({behavior:'smooth',block:'start'}),90)}
function setStatus(id,status,detail){const c=csById(id);if(!c)return;const old=c.status;c.status=status;queue('review',id,status==='approved'?'אושר':status==='timeout'?'Timeout Reject ללא נימוק':`בקשת תיקון: ${detail||'ללא פירוט'}`);log(`${statusLabel[status]} · ${id}`,detail||`סטטוס קודם: ${statusLabel[old]}`);render();toast(status==='timeout'?'דחיית Timeout נשמרה. אין צורך לנמק.':status==='approved'?'האישור נשמר בהיסטוריית ה־Changeset.':'בקשת התיקון נשמרה.')}
function showFeedback(){const target=document.getElementById('feedbackSlot');if(!target)return;target.innerHTML=`<div class="feedback-editor"><label for="feedbackText">מה תרצה שהסוכן ישנה? (אפשר גם לפצל או לסדר מחדש קומיטים)</label><textarea id="feedbackText" placeholder="למשל: פצל את טיפול ה־fallback לקומיט מקדים, ושמור את בדיקות ה־telemetry..."></textarea><button class="btn btn-primary" data-action="save-feedback" data-id="${state.selected}">${icon('check')}שמור בקשת תיקון</button></div>`;target.querySelector('textarea').focus()}
function showModal(inner){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalHeading">${inner}</section></div>`;document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modalRoot').innerHTML='';document.body.style.overflow=''}
function openRecord(kind,id){const list=state[kind];const r=id?list.find(x=>x.id===id):null;const type=kind==='decisions'?'החלטה':'הנחה';const opts=kind==='decisions'?[['accepted','התקבלה'],['rejected','נדחתה']]:[['verified','אומתה'],['unverified','טרם אומתה'],['changed','תוקנה']];const s=r?.status||opts[0][0];showModal(`<div class="modal-header"><h2 id="modalHeading">${r?'עריכת':'הוספת'} ${type}</h2><button class="btn" data-action="close-modal" aria-label="סגור">${icon('close')}</button></div><form id="recordForm" data-kind="${kind}" data-id="${r?.id||''}"><div class="modal-body"><div class="modal-field"><label for="recordTitle">תיאור ${type}</label><textarea id="recordTitle" name="title" required>${escapeHtml(r?.title||'')}</textarea></div><div class="modal-field"><label for="recordStatus">סטטוס</label><select name="status" id="recordStatus">${opts.map(([v,l])=>`<option value="${v}" ${s===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="modal-field"><label>קשור ל־Changesets</label>${state.changesets.map(c=>`<label class="choice"><input type="checkbox" name="links" value="${c.id}" ${r?.links.includes(c.id)?'checked':''}><span><b>${c.id}</b> · ${escapeHtml(c.title)}</span></label>`).join('')}</div><div class="modal-footer"><button type="button" class="btn" data-action="close-modal">ביטול</button><button type="submit" class="btn btn-primary">${icon('check')} שמור</button></div></div></form>`)}
function hasCycle(changesets){const map=new Map(changesets.map(c=>[c.id,c.deps]));const visit=new Set(),done=new Set();function walk(id){if(visit.has(id))return true;if(done.has(id))return false;visit.add(id);for(const d of map.get(id)||[])if(walk(d))return true;visit.delete(id);done.add(id);return false}return [...map.keys()].some(walk)}
function openDeps(id){const c=csById(id);if(!c)return;showModal(`<div class="modal-header"><h2 id="modalHeading">עריכת תלויות · ${id}</h2><button class="btn" data-action="close-modal">${icon('close')}</button></div><form id="depsForm" data-id="${id}"><div class="modal-body"><p class="subtle" style="margin:0 0 15px;font-size:12px">סמן אילו Changesets חייבים להקדים את ${id}. בדמו נבדוק שלא נוצר מעגל.</p>${state.changesets.filter(x=>x.id!==id).map(x=>`<label class="choice"><input type="checkbox" name="deps" value="${x.id}" ${c.deps.includes(x.id)?'checked':''}><span><b>${x.id}</b> · ${escapeHtml(x.title)}</span></label>`).join('')}<div class="modal-footer"><button type="button" class="btn" data-action="close-modal">ביטול</button><button type="submit" class="btn btn-primary">${icon('check')}עדכן גרף</button></div></div></form>`)}
function simulatedHash(id,rev){let x=0x9e3779b1;for(const ch of id+':'+rev+':'+state.iteration)x=(Math.imul(x,33)^ch.charCodeAt(0))>>>0;return x.toString(16).padStart(8,'0').slice(0,7)}
function submitIteration(){if(!state.pending.length)return;const affected=new Set();for(const p of state.pending){if(p.type==='review'||p.type==='deps')affected.add(p.id);if(p.type==='record'){const group=p.id.startsWith('D')?state.decisions:state.assumptions;const r=group.find(x=>x.id===p.id);if(r)r.links.forEach(id=>affected.add(id));if(p.ids)p.ids.forEach(id=>affected.add(id))}}
 state.iteration++;let count=0;for(const c of state.changesets){if(!affected.has(c.id))continue;c.rev++;c.hash=simulatedHash(c.id,c.rev);c.history.push({rev:c.rev,hash:c.hash,note:'סימולציה: גרסה חדשה אחרי פידבק'});c.status='pending';count++}
 log(`סבב ${state.iteration} הוכן (סימולציה)`,`${state.pending.length} פריטי פידבק עובדו, ${count} changesets קיבלו גרסאות דמה חדשות. Changesets שלא השתנו שמרו על אישורם.`);state.pending=[];render();toast(`סבב ${state.iteration} נוצר בדמו · ${count} גרסאות עודכנו`)}
function reset(){if(!confirm('לאפס את כל השינויים שנעשו בדמו?'))return;clearInterval(timer.handle);timer={id:null,seconds:180,running:false,handle:null};state=structuredClone(initial);render();toast('הדמו אופס למצב ההתחלתי')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el){if(e.target.id==='backdrop')closeModal();return}const action=el.dataset.action;
 if(action==='nav')navigate(el.dataset.page);
 else if(action==='select')selectCS(el.dataset.id,true);
 else if(action==='select-from-list')selectCS(el.dataset.id,true);
 else if(action==='set-status')setStatus(el.dataset.id,el.dataset.status);
 else if(action==='show-feedback')showFeedback();
 else if(action==='save-feedback'){const value=document.getElementById('feedbackText')?.value.trim();if(!value){toast('כדאי לכתוב מה תרצה לשנות, או לבחור Timeout ללא הסבר.');return}setStatus(el.dataset.id,'changes',value)}
 else if(action==='timer')toggleTimer();
 else if(action==='edit-record')openRecord(el.dataset.kind,el.dataset.id);
 else if(action==='new-record')openRecord(el.dataset.kind,null);
 else if(action==='edit-deps')openDeps(el.dataset.id);
 else if(action==='close-modal')closeModal();
 else if(action==='submit-iteration')submitIteration();
 else if(action==='reset')reset();
});
document.addEventListener('submit',e=>{if(e.target.id==='recordForm'){e.preventDefault();const form=e.target;const kind=form.dataset.kind;const id=form.dataset.id;const fd=new FormData(form);const title=String(fd.get('title')||'').trim();if(!title){toast('יש להזין תיאור');return}const list=state[kind],previous=list.find(r=>r.id===id);const links=fd.getAll('links').map(String);const record={id:id||`${kind==='decisions'?'D':'A'}-${String(list.length+1).padStart(2,'0')}`,title,status:String(fd.get('status')),links};const oldLinks=previous?.links||[];if(previous)Object.assign(previous,record);else list.push(record);queue('record',record.id,`${previous?'עודכנה':'נוספה'} ${kind==='decisions'?'החלטה':'הנחה'}: ${record.title}`);state.pending[state.pending.length-1].ids=[...new Set([...links,...oldLinks])];log(`${previous?'עודכנה':'נוספה'} ${kind==='decisions'?'החלטה':'הנחה'} ${record.id}`,title);closeModal();render();toast('השינוי נשמר ונוסף לפידבק לסוכן')}
 else if(e.target.id==='depsForm'){e.preventDefault();const id=e.target.dataset.id;const c=csById(id);const deps=new FormData(e.target).getAll('deps').map(String);const snapshot=state.changesets.map(x=>({...x,deps:x.id===id?deps:x.deps}));if(hasCycle(snapshot)){toast('אי אפשר ליצור תלות מעגלית בגרף.');return}if(JSON.stringify([...c.deps].sort())!==JSON.stringify([...deps].sort())){c.deps=deps;queue('deps',id,`תלויות עודכנו: ${deps.length?deps.join(', '):'מסלול עצמאי'}`);log(`תלויות של ${id} עודכנו`,`תלויות חדשות: ${deps.join(', ')||'אין'}`)}closeModal();render();toast('גרף התלויות עודכן')}
});
render();
})();
</script>
</body>
</html>
