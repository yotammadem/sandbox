name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - apps/safe-artifact-playground/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test playground
        run: npm test --workspace=@sandbox/safe-artifact-playground

      - name: Build playground
        run: npm run build --workspace=@sandbox/safe-artifact-playground

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/safe-artifact-playground/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
