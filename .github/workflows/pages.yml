name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - apps/safe-artifact-playground/**
      - apps/investment-lab/**
      - apps/persian-escape/**
      - experiments/btc-regime-validation/sources/btc-usd-bitstamp.csv
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Refresh Bitcoin market data
        if: github.event_name != 'push' || github.event.head_commit.message == 'enable daily BTC refresh'
        run: node apps/investment-lab/scripts/update-btc-data.js

      - name: Commit refreshed Bitcoin data
        if: github.event_name != 'push' || github.event.head_commit.message == 'enable daily BTC refresh'
        run: |
          git add experiments/btc-regime-validation/sources/btc-usd-bitstamp.csv
          if git diff --cached --quiet; then
            echo "Bitcoin data is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update BTC market data"
            git push origin HEAD:main
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test playground
        run: npm test --workspace=@sandbox/safe-artifact-playground

      - name: Build playground
        run: npm run build --workspace=@sandbox/safe-artifact-playground

      - name: Test investment lab
        run: npm test --workspace=@sandbox/investment-lab

      - name: Build investment lab
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build --workspace=@sandbox/investment-lab

      - name: Assemble experiments
        run: cp -R apps/investment-lab/dist apps/safe-artifact-playground/dist/investment-lab

      - name: Add Persian Escape
        run: cp -R apps/persian-escape apps/safe-artifact-playground/dist/persian-escape

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/safe-artifact-playground/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
