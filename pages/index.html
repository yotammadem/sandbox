<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sandbox</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(3rem, 12vw, 7rem);
      }

      p {
        margin: 0;
        color: #cbd5e1;
        font-size: 1.125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello 👋</h1>
      <p>GitHub Pages deployment from the sandbox monorepo works.</p>
    </main>
  </body>
</html>
